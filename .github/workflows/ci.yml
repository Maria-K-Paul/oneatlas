name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oneatlas
          POSTGRES_PASSWORD: oneatlas
          POSTGRES_DB: oneatlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oneatlas"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://oneatlas:oneatlas@localhost:5432/oneatlas_test
      DIRECT_URL: postgresql://oneatlas:oneatlas@localhost:5432/oneatlas_test
      TEST_DATABASE_URL: postgresql://oneatlas:oneatlas@localhost:5432/oneatlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests (includes validating the committed dataset)
        run: npm test
      - name: Integration tests (migrations, ingestion, constraints)
        run: npm run test:integration
      - run: npm run build
